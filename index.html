  <style>

<body>
  <h1>Plannr Sync for Outlook</h1>
  <p>A personal Outlook add-in: a "Chase in Plannr" button on an email that opens the owner's
  Plannr Sync app (running locally on their PC) on the sender's client. It reads only the
  sender's email address, stores nothing and sends nothing anywhere else.</p>
</body>
